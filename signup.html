<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ثبت‌نام | MTA</title>
<style>
:root{--bg:#07090d;--panel:#0e1219;--line:#202632;--text:#f5f7fa;--muted:#9aa3b2;--accent:#b7ff45;--danger:#ff6b6b}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  font-family:Tahoma,Arial,sans-serif;color:var(--text);
  background:
  radial-gradient(circle at 15% 15%,rgba(183,255,69,.09),transparent 25%),
  radial-gradient(circle at 85% 85%,rgba(183,255,69,.04),transparent 25%),
  var(--bg)
}
a{color:inherit;text-decoration:none}
.shell{width:min(980px,94%);display:grid;grid-template-columns:.85fr 1.15fr;border:1px solid var(--line);border-radius:26px;overflow:hidden;background:var(--panel);box-shadow:0 30px 90px rgba(0,0,0,.45)}
.brand{
  position:relative;min-height:650px;padding:48px;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(145deg,#121821,#090c11);overflow:hidden
}
.brand:after{
  content:"MTA";position:absolute;left:-30px;bottom:70px;font-size:150px;font-weight:900;letter-spacing:10px;
  color:rgba(255,255,255,.025);transform:rotate(-90deg);pointer-events:none
}
.logo{font-size:29px;font-weight:900;letter-spacing:6px}.logo span{color:var(--accent)}
.brand h1{font-size:40px;line-height:1.5;margin:0 0 10px}
.brand p{color:var(--muted);margin:0;max-width:340px;line-height:2}
.badge{color:var(--accent);font-size:12px;font-weight:bold;letter-spacing:3px}
.form-side{padding:48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}
.top h2{font-size:28px;margin:0}.back{color:var(--muted);font-size:13px}
.form{display:grid;gap:17px}
.group{display:grid;gap:8px}
label{font-size:13px;color:#d9dde5}
input{
 width:100%;height:50px;border:1px solid var(--line);border-radius:12px;background:#090d13;
 color:var(--text);padding:0 14px;font:inherit;outline:none;transition:.2s
}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(183,255,69,.07)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.terms{display:flex;align-items:flex-start;gap:9px;color:var(--muted);font-size:12px;line-height:1.8}
.terms input{width:16px;height:16px;margin-top:5px;accent-color:var(--accent)}
button{
 height:52px;border:0;border-radius:12px;background:var(--accent);color:#090b08;font-weight:900;font-size:15px;cursor:pointer
}
button:hover{filter:brightness(.95)}
.login{text-align:center;color:var(--muted);font-size:13px;margin-top:5px}.login a{color:var(--accent);font-weight:bold}
.message{display:none;padding:12px 14px;border-radius:10px;font-size:13px}
.message.ok{display:block;background:rgba(183,255,69,.08);border:1px solid rgba(183,255,69,.3);color:#dfffaa}
.message.err{display:block;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.3);color:#ffc1c1}
@media(max-width:800px){
 .shell{grid-template-columns:1fr;width:min(560px,94%)}
 .brand{min-height:auto;padding:30px}
 .brand h1{font-size:28px}.brand p{display:none}.brand:after{display:none}
 .form-side{padding:30px}.row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="shell">
  <section class="brand">
    <a class="logo" href="index.html">MT<span>A</span></a>
    <div>
      <div class="badge">WELCOME TO MTA</div>
      <h1>عضویت در MTA</h1>
      <p>حساب کاربری خود را ایجاد کنید تا به بخش‌های اختصاصی MTA دسترسی داشته باشید.</p>
    </div>
    <small style="color:var(--muted)">© 2026 MTA</small>
  </section>

  <section class="form-side">
    <div class="top">
      <h2>ایجاد حساب کاربری</h2>
      <a class="back" href="index.html">← بازگشت به سایت</a>
    </div>

    <form class="form" id="signupForm">
      <div class="row">
        <div class="group">
          <label for="name">نام و نام خانوادگی</label>
          <input id="name" name="name" type="text" placeholder="مثلاً امین جعفر" required>
        </div>
        <div class="group">
          <label for="phone">شماره موبایل</label>
          <input id="phone" name="phone" type="tel" inputmode="numeric" placeholder="09xxxxxxxxx" required>
        </div>
      </div>

      <div class="group">
        <label for="email">ایمیل</label>
        <input id="email" name="email" type="email" placeholder="name@example.com" required>
      </div>

      <div class="row">
        <div class="group">
          <label for="password">رمز عبور</label>
          <input id="password" name="password" type="password" minlength="8" placeholder="حداقل ۸ کاراکتر" required>
        </div>
        <div class="group">
          <label for="confirm">تکرار رمز عبور</label>
          <input id="confirm" name="confirm" type="password" minlength="8" placeholder="رمز را دوباره وارد کنید" required>
        </div>
      </div>

      <label class="terms">
        <input id="terms" type="checkbox" required>
        <span>با ایجاد حساب، قوانین و شرایط استفاده از MTA را می‌پذیرم.</span>
      </label>

      <div id="message" class="message"></div>
      <button type="submit">ثبت‌نام در MTA</button>

      <div class="login">قبلاً حساب ساخته‌اید؟ <a href="#">ورود به حساب</a></div>
    </form>
  </section>
</div>

<script>
const form = document.getElementById('signupForm');
const msg = document.getElementById('message');

form.addEventListener('submit', function(e){
  e.preventDefault();

  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;

  if(!/^09\d{9}$/.test(phone)){
    msg.className='message err';
    msg.textContent='شماره موبایل را به شکل 09xxxxxxxxx وارد کنید.';
    return;
  }

  if(password !== confirm){
    msg.className='message err';
    msg.textContent='رمز عبور و تکرار آن یکسان نیست.';
    return;
  }

  msg.className='message ok';
  msg.textContent='فرم با موفقیت بررسی شد. برای ثبت واقعی کاربران، این صفحه باید به سرور و دیتابیس متصل شود.';
});
</script>
</body>
</html>
